    <div class="content">
        <h3>How many times can you procrastinate until you're 88 years old <br> if you procrastinate 4 times per day (as a 14-year-old)?</h3>

        <script> 
        let age = window.prompt("Enter your age please:", "14");
        let maxAge = window.prompt("Enter the max age you want to reach:", "88");
        let numPerDay = window.prompt("How many times per day do you want to procrastinate?", "4");
        let sureKaBa = window.confirm(`Are your inputs, namely ${age} years old, ${maxAge} years old, and ${4} times, to be confirmed?`)

        var totalRequired = (numPerDay * 365) * (maxAge - age);
        
        if (sureKaBa)
          document.write("Answer: You can procrastinate " + totalRequired + " more times until you reach the ripe old age of " + maxAge + ".");
        else
          alert("Run the code again");

        </script>
