    <div class="content">
        <script> 
        let age = window.prompt("Enter your age please:", "14");
        let maxAge = window.prompt("Enter the max age you want to reach:", "88");
        let numPerDay = window.prompt("How many times per day do you want to procrastinate?", "4");
        let sureKaBa = window.confirm(`Are your inputs, namely ${age} years old, ${maxAge} years old, and ${numPerDay} times, to be confirmed?`)

        var totalRequired = (numPerDay * 365) * (maxAge - age);
        
        document.write(`<br><b>How many times can you procrastinate until you're ${maxAge} years old if you procrastinate ${numPerDay} times per day (as a ${age}-year-old)?</b>`);
        if (sureKaBa)
          document.write(`<br><br><b>Answer:</b> You can procrastinate ${totalRequired} more times until you reach the ripe old age of ${maxAge}.`);
        else
          alert("Run the code again");

        document.write("<i>#PisayScholar #ProudCrammer");
        </script>
