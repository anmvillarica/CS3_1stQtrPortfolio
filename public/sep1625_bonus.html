<!DOCTYPE html>

<html>
    <title>Ianna's Guessing Game!</title>
    <link rel="stylesheet" href="../styles_sep1625.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<head> 

</head>

<body>
    <div class = "page">
        <img id = "penguinImage" src="../sep1625_img.png" onclick="makeGuess()"></button>
    <div class = "input">
        <h1 id = "title">Guess My Word!</h1>
        <p id="wordDisplay"></p>
        <input type="text" id="guessInput" maxlength="1">
        <div id = "failedAttempts"></div>
        <p id="message"></p>
        <div id = usedLetters><b>Incorrect Guesses:<b> </div>
    </div>
    </div>

    <script>
    let secretWord = ["i", "g", "l", "o", "o"];
    let guessedWord = ["_", "_", "_", "_", "_"];

    document.getElementById("wordDisplay").textContent = guessedWord.join(" ");
    
    let incorrectGuesses = [];
    let usedLetters = document.getElementById("usedLetters");

    let correctGuesses = []; 

    let attemptsLeft = 5;
    let attempts = document.getElementById("failedAttempts"); 
    attempts.innerHTML += `<b>Number of Tries Left:<b> <i>${attemptsLeft}<i>`;

    let addToList = true; 

    function makeGuess() { 
        if (attemptsLeft > 0) 
        { 
            let guess = document.getElementById("guessInput").value.toLowerCase();
            let correct = false;

            for (let i = 0; i < secretWord.length; i++) {
                if (secretWord[i] === guess) {
                    guessedWord[i] = guess;
                    correct = true;
                    
                    checkExistence(correctGuesses, guess);
                }
            }

            if (correct == false)
            {
                checkExistence(incorrectGuesses, guess);
                if(addToList == true)
                    usedLetters.innerHTML += guess + " ";

                attemptsLeft--; 
                attempts.innerHTML = `<b>Number of Tries Left:<b> ${attemptsLeft}`;
            }

            if(correctGuesses.length == 4)
                confetti();

            document.getElementById("wordDisplay").textContent = guessedWord.join(" ");
            document.getElementById("message").textContent = correct ? "✅ Correct!" : "❌ Try again.";
            document.getElementById("guessInput").value = "";
        }
        else 
        {
            document.getElementById("message").innerHTML = '<h4>No more tries... 😔</h4><button onclick="makeGuess()" id = "playAgain">Play Again?</button>';
            incorrectGuesses = []; 
            correctGuesses = []; 
            attemptsLeft = 6;  
            attempts.innerHTML = `<b>Number of Tries Left:<b> <i>${attemptsLeft}<i>`;
            usedLetters.innerHTML = "<b>Incorrect Guesses: <b>";

        }
    }

    function checkExistence(listy, guess) {
        for (let i = 0; i < listy.length; i++){
            if(guess != listy[i])
                addToList = true; 
            else 
            {
                addToList = false; 
                break; 
            }
        }

        if (addToList == true)
        {
            listy.push(guess);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
