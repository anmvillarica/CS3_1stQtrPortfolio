        <h2>Q1 3rd Graded Exercise <i>submitted by Arianna Villarica <br> of 9-Potassium</i></h2>

        <p>Guess the number: ****</p>
        <p>The number is <u>from 1 to 100</u></p>

        <label for="inp_numberGuess">Enter your guess: </label>
        <input id="inp_numberGuess" type="number"><br><br>

        <button type="button" id = "otp_button"><b>CHECK YOUR SHERLOCK HOLMES SKILLS</b></button> 

        <div class="js_otp">
        <p id = "otp_label"><b>Result: </b></p>
        <p id ="otp_area"></p>
        </div>

        <script>
            var dNumber = Math.floor(Math.random() * 100) + 1;
            var btn = document.getElementById("otp_button");

            btn.addEventListener('click', checkIt);

            function checkIt() {
                let guess = +document.getElementById("inp_numberGuess").value; 
                let result = " ";

                if (guess != 0 && guess <= 100)
                {
                    if (guess == dNumber)
                    {
                        result = "You are CORRECT!";
                        confetti();
                    }
                    else if (guess < dNumber)
                        result = "The number is HIGHER!"; 
                    else if (guess > dNumber)
                        result = "The number is LOWER!";
                }
                else
                    result = "Enter a number between 1 and 100 (inclusive)!";

                document.getElementById("otp_area").innerHTML = result;
            }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
