<body> 
<div class="page">
    <div class="information">
      <a href="../index.html" style="text-decoration: none;"><b><h1 id = "title"> - VILLARICA, Arianna's Portfolio! - </h1></b></a>

    <div class="content">
        <h2>Q1 2nd Graded Exercise <i>submitted by Arianna Villarica of 9-Potassium</i></h2>

        <label for="inp_mealPrice">Meal Price: </label>
        <input id="inp_mealPrice"><br><br>
        <label for="inp_tip">Tip: </label>
        <input id="inp_tip"><br><br>
        <label for="inp_serviceCharge">Service Charge: </label>
        <input id="inp_serviceCharge"><br><br>

        <button type="button" id = "otp_button"><b>CALCULATE TOTAL COST!</b></button> 

        <div class="js_otp">
        <p id = "otp_label"><b>Total Meal: </b></p>
        <p id ="otp_area"></p>
        </div>

        <script>
            var btn = document.getElementById("otp_button");

            btn.addEventListener('click', totalMeal);

            function totalMeal() {
                let mp = +document.getElementById("inp_mealPrice").value;
                let tip = +document.getElementById("inp_tip").value;
                let sc = +document.getElementById("inp_serviceCharge").value;

                let totalCost = mp + tip + (sc / 100 * mp);
                let otp_totalCost = toFixed(totalCost, 2);

                document.getElementById("otp_area").innerHTML += `${otp_totalCost}`;
            }
        </script>
    </div>
  </div>
