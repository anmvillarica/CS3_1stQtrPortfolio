        <label for="inp_tip">Tip: </label>
        <input id="inp_tip"><br><br>
        <label for="inp_serviceCharge">Service Charge: </label>
        <input id="inp_serviceCharge"><br><br>

        <button type="button" id = "otp_button">Output here!</button> 

        <script>
            const mp = number(document.getElementById("inp_mealPrice"));
            const tip = document.getElementById("inp_tip");
            const sc = document.getElementById("inp_serviceCharge");

            const btn = document.getElementById("otp_button");

            btn.addEventListener('click', totalMeal);

            function totalMeal() {
                totalCost = (mp + tip + (sc / 100 * mp));

                alert("Total Meal: " + totalCost);
            }
        </script>
